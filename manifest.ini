name = codexStatusAnnouncer
summary = "ChatGPT Desktop Access for NVDA"
description = "Makes the ChatGPT Windows app easier to use with NVDA. It announces activity, supports speech, Braille, and sounds, and adds chat navigation, voice controls, and better focus handling in both ChatGPT and Codex."
author = "Justin Coffin <jcoffin@samobile.net>"
url = https://github.com/jcoffin1/chatgpt-desktop-access
docFileName = readme.md
version = 2026.3.0
changelog = """* Working sounds and progress updates follow ChatGPT's own task timer. A new command, Read the native task timer, can be assigned in Input Gestures.
* NVDA announces the chat title once when you switch chats, and NVDA+Shift+C repeats it.
* Control+1 through Control+0 read the messages of the conversation you are in, in any ChatGPT interface language.
* New commands, assignable in Input Gestures, move to the first project or recent chat in the sidebar, or archive the focused sidebar chat. NVDA also says when the sidebar is shown or hidden.
* German, Spanish, and Brazilian Portuguese translations."""
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.3.0
updateChannel = None
