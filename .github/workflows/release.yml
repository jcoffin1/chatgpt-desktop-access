name: Publish NVDA add-on release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  build-audit-publish-verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Confirm tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit already present on main"
          }

      - name: Validate tag and build audited package
        shell: pwsh
        run: |
          $manifestVersion = ((Select-String -Path manifest.ini -Pattern '^version = (.+)$').Matches[0].Groups[1].Value).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$manifestVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $manifestVersion"
          }
          .\build.ps1 -PythonPath python

      - name: Verify reproducibility and prepare release notes
        shell: pwsh
        run: |
          $manifestVersion = ((Select-String -Path manifest.ini -Pattern '^version = (.+)$').Matches[0].Groups[1].Value).Trim()
          $package = "outputs/chatGPTDesktopAccess-$manifestVersion.nvda-addon"
          $reproduction = "outputs/chatGPTDesktopAccess-$manifestVersion-reproduction.nvda-addon"
          python tools/build_addon.py $reproduction
          $packageHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash
          $reproductionHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $reproduction).Hash
          if ($packageHash -ne $reproductionHash) {
            throw "Reproducible-build checksum mismatch"
          }
          $changelog = Get-Content -Raw -LiteralPath changelog.md
          $releaseMatch = [regex]::Match(
            $changelog,
            "(?ms)^## $([regex]::Escape($manifestVersion))\s*(.*?)(?=^##\s|\z)"
          )
          if (-not $releaseMatch.Success) {
            throw "Release notes for $manifestVersion were not found"
          }
          $releaseMatch.Groups[1].Value.Trim() | Out-File -FilePath "outputs/RELEASE-NOTES-$manifestVersion.md" -Encoding utf8
          "SHA256=$packageHash" | Out-File -FilePath "outputs/SHA256-$manifestVersion.txt" -Encoding utf8

      - name: Publish validated package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestVersion = ((Select-String -Path manifest.ini -Pattern '^version = (.+)$').Matches[0].Groups[1].Value).Trim()
          $package = "outputs/chatGPTDesktopAccess-$manifestVersion.nvda-addon"
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; preserving it for verification."
          } else {
            gh release create $env:GITHUB_REF_NAME $package `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "ChatGPT Desktop Access $manifestVersion" `
              --notes-file "outputs/RELEASE-NOTES-$manifestVersion.md"
          }

      - name: Download and verify published asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestVersion = ((Select-String -Path manifest.ini -Pattern '^version = (.+)$').Matches[0].Groups[1].Value).Trim()
          $package = "outputs/chatGPTDesktopAccess-$manifestVersion.nvda-addon"
          $verificationDirectory = "outputs/published-verification"
          New-Item -ItemType Directory -Path $verificationDirectory | Out-Null
          $assetNames = @(gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json assets `
            --jq '.assets[].name')
          $addOnAssets = @($assetNames | Where-Object { $_ -like '*.nvda-addon' })
          if ($addOnAssets.Count -ne 1) {
            throw "Release must contain exactly one NVDA add-on asset; found $($addOnAssets.Count)"
          }
          $publishedAsset = $addOnAssets[0]
          gh release download $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $publishedAsset `
            --dir $verificationDirectory
          $downloaded = Join-Path $verificationDirectory $publishedAsset
          $packageHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash
          $downloadedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloaded).Hash
          if ($packageHash -ne $downloadedHash) {
            throw "Published release checksum mismatch"
          }
          python tools/audit_addon.py $downloaded $manifestVersion
          "Published SHA256=$downloadedHash"
