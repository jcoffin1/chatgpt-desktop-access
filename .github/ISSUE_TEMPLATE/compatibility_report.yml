name: Share compatibility test results
description: Use after testing a new NVDA, ChatGPT, Windows, display, or synthesizer version.
title: "[Compatibility]: "
labels: ["accessibility"]
body:
  - type: input
    id: addonVersion
    attributes:
      label: Add-on version
      placeholder: 2026.2.6
    validations:
      required: true
  - type: input
    id: nvdaVersion
    attributes:
      label: NVDA version and channel
      placeholder: NVDA 2026.2 stable
    validations:
      required: true
  - type: input
    id: chatgptVersion
    attributes:
      label: ChatGPT desktop app version
      placeholder: 1.2026.x
  - type: input
    id: windowsVersion
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Everything tested passed
        - Some features failed
        - Add-on did not load
        - Performance or responsiveness regressed
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: Features tested
      description: List the speech, Braille, sound, navigation, dialog, voice, or browser features you tested.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failures or unexpected behavior
      description: Include concise reproduction steps. For a repeatable failure, also open a separate bug report so it can be tracked clearly.
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only reviewed diagnostics or logs with private information removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private conversation text, passwords, tokens, or personal information.
          required: true
