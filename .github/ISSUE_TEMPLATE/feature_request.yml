name: Request a feature
description: Use this when you want the add-on to do something it cannot do today.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the result you need, not only a proposed technical solution. If an existing feature is broken, choose **Report a bug or problem**. New keyboard actions should be configurable through NVDA's Input Gestures dialog and must not conflict with other applications.
  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What can you not accomplish with the current add-on, or what could work better?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what the user should be able to accomplish after this change.
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Primary area
      options:
        - Speech
        - Braille
        - Sounds
        - Chat navigation
        - Settings
        - Voice mode
        - Dialogs and permissions
        - Embedded browser
        - Keyboard or Braille input
        - Reliability or performance
        - Other
    validations:
      required: true
  - type: textarea
    id: channels
    attributes:
      label: Speech, Braille, and sound behavior
      description: Describe how the feature should behave on each relevant output channel.
  - type: dropdown
    id: gesture
    attributes:
      label: Keyboard access
      description: If the feature needs a command, it will be configurable in NVDA's Input Gestures dialog.
      options:
        - No keyboard command is needed
        - An assignable Input Gestures action would help
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe anything you currently do instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private conversation text, passwords, tokens, or personal information.
          required: true
