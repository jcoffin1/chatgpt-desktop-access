name: Report a bug
description: Use this when something is broken, incorrect, slow, silent, or unreliable.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when an existing feature does not work as expected. If you want a new capability, choose **Request a feature**. If the feature works but is difficult to use, choose **Accessibility or usability feedback**.

        Never post passwords, tokens, private conversation text, commands, or personal file paths. The add-on's sanitized support report is safer than an unreviewed NVDA log.
  - type: input
    id: addonVersion
    attributes:
      label: Add-on version
      description: Find this in NVDA's Add-on Store or Add-on Manager.
      placeholder: 2026.2.6
    validations:
      required: true
  - type: input
    id: nvdaVersion
    attributes:
      label: NVDA version
      placeholder: 2026.2
    validations:
      required: true
  - type: input
    id: chatgptVersion
    attributes:
      label: ChatGPT desktop app version
      description: Include the version if it is available in the ChatGPT app settings.
      placeholder: 1.2026.x
  - type: input
    id: windowsVersion
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: experience
    attributes:
      label: ChatGPT experience
      options:
        - ChatGPT mode
        - Codex mode
        - Embedded browser
        - More than one
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does the problem happen?
      options:
        - Focus mode only
        - Browse mode only
        - Both focus and browse modes
        - Outside the ChatGPT window
        - Before the mode matters or not sure
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: What is affected?
      multiple: true
      options:
        - Speech
        - Braille
        - Clicks
        - Musical tones
        - Chat navigation or actions
        - Keyboard or Braille input
        - Focus or browse-position stability
        - Permission or pop-up dialogs
        - Voice mode
        - Performance or responsiveness
        - Settings
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - No or not sure
        - Yes
        - This is my first version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start with opening ChatGPT or restarting NVDA and give the shortest numbered sequence that reproduces the problem.
      placeholder: |
        1. Open ChatGPT and...
        2. Press...
        3. NVDA...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exactly what NVDA spoke, displayed in Braille, played, or failed to do.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized support report
      description: Paste the add-on's sanitized support report. Attach an NVDA log only after reviewing and removing private information.
      render: text
  - type: checkboxes
    id: finalChecks
    attributes:
      label: Final checks
      options:
        - label: I checked the Releases page and confirmed whether this happens with the newest published version.
          required: true
        - label: I did not include passwords, tokens, private conversation text, or other personal information.
          required: true
