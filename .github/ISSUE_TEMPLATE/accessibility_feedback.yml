name: Accessibility or usability feedback
description: Use this when something works but is difficult, confusing, or disruptive.
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for barriers involving speech, Braille, keyboard access, focus, announcements, or cognitive load. If an existing feature is broken or produces an error, choose **Report a bug or problem** instead.
  - type: textarea
    id: barrier
    attributes:
      label: Accessibility barrier
      description: Describe what is difficult, confusing, distracting, interrupted, or unnecessarily complicated.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Speech
        - Braille output
        - Braille input
        - Keyboard navigation
        - Focus management
        - Sounds
        - Settings
        - Chat history or actions
        - Dialogs or permissions
        - Embedded browser
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: NVDA mode
      options:
        - Focus mode
        - Browse mode
        - Both
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Explain how this affects completing or understanding the task.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Preferred accessible experience
      description: Describe the speech, Braille, sound, keyboard, or focus behavior that would help.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant setup details
      description: Include NVDA version, add-on version, Braille display, synthesizer, and sound configuration when relevant.
      placeholder: Add-on 2026.2.6; NVDA 2026.2; optional display or synthesizer
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Describe any workaround you use today.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private conversation text, passwords, tokens, or personal information.
          required: true
