name: Ask a question or improve documentation
description: Use for setup help or unclear instructions, not for broken behavior.
title: "[Docs/Support]: "
labels: ["question", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when you need help using the add-on or found unclear or missing documentation. If a feature is broken, choose **Report a bug** instead.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation or upgrade
        - Settings
        - Input Gestures
        - Speech or Braille
        - Sounds
        - Chat navigation or actions
        - Voice mode
        - Troubleshooting
        - Building or contributing
        - Documentation correction
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question or documentation problem
      description: Explain what you are trying to do and where you became stuck.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you already tried
      description: Include the guide, setting, gesture, or troubleshooting step you tried.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the add-on and NVDA versions when relevant.
      placeholder: Add-on 2026.2.6; NVDA 2026.2
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested documentation change
      description: If applicable, suggest clearer wording or missing instructions.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include private conversation text, passwords, tokens, or personal information.
          required: true
