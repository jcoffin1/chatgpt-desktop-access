description = "Torna o aplicativo ChatGPT para Windows mais fácil de usar com o NVDA. Anuncia a atividade, oferece suporte a fala, braille e sons, e adiciona navegação entre chats, controles de voz e melhor tratamento do foco no ChatGPT e no Codex."
changelog = """* Os sons de trabalho e as atualizações de progresso seguem o próprio temporizador de tarefas do ChatGPT. Um novo comando, Ler o temporizador nativo da tarefa, pode ser atribuído em Gestos de entrada.
* NVDA+Shift+C lê o título do chat atual, e o NVDA anuncia o título quando você muda de chat.
* Ctrl+1 a Ctrl+0 leem as mensagens recentes em qualquer idioma da interface do ChatGPT."""
