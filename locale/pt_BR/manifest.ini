description = "Torna o aplicativo ChatGPT para Windows mais fácil de usar com o NVDA. Anuncia a atividade, oferece suporte a fala, braille e sons, e adiciona navegação entre chats, controles de voz e melhor tratamento do foco no ChatGPT e no Codex."
changelog = """* Os sons de trabalho e as atualizações de progresso seguem o próprio temporizador de tarefas do ChatGPT. Um novo comando, Ler o temporizador nativo da tarefa, pode ser atribuído em Gestos de entrada.
* O NVDA anuncia uma vez o título do chat quando você muda de chat, e NVDA+Shift+C o repete.
* Ctrl+1 a Ctrl+0 leem as mensagens da conversa em que você está, em qualquer idioma da interface do ChatGPT.
* Novos comandos, que podem ser atribuídos em Gestos de entrada, vão para o primeiro projeto ou o primeiro chat recente da barra lateral, ou arquivam o chat em foco na barra lateral. O NVDA também anuncia quando a barra lateral é exibida ou ocultada.
* Traduções para alemão, espanhol e português do Brasil."""
