description = "Améliore l’accessibilité de l’application ChatGPT pour Windows avec NVDA. L’extension annonce l’activité par la parole, le braille et les sons. Elle facilite la navigation entre les chats, les commandes vocales et la gestion du focus dans ChatGPT et Codex."
changelog = """* Les sons et annonces de progression suivent le compteur de tâche de ChatGPT. Une nouvelle commande, Lire le compteur natif de la tâche, peut être attribuée dans Gestes de commandes.
* NVDA+Maj+C lit le titre du chat en cours, et NVDA annonce le titre lorsque vous changez de chat.
* Contrôle+1 à Contrôle+0 lisent les messages récents quelle que soit la langue de l’interface de ChatGPT."""
