description = "Améliore l’accessibilité de l’application ChatGPT pour Windows avec NVDA. L’extension annonce l’activité par la parole, le braille et les sons. Elle facilite la navigation entre les chats, les commandes vocales et la gestion du focus dans ChatGPT et Codex."
changelog = """* Les sons et annonces de progression suivent le compteur de tâche de ChatGPT. Une nouvelle commande, Lire le compteur natif de la tâche, peut être attribuée dans Gestes de commandes.
* NVDA annonce une seule fois le titre du chat lorsque vous changez de chat, et NVDA+Maj+C le répète.
* Contrôle+1 à Contrôle+0 lisent les messages de la conversation dans laquelle vous vous trouvez, quelle que soit la langue de l’interface de ChatGPT.
* De nouvelles commandes, à attribuer dans Gestes de commandes, permettent d’aller au premier projet ou au premier chat récent de la barre latérale, ou d’archiver le chat sous le focus dans la barre latérale. NVDA annonce aussi l’affichage ou le masquage de la barre latérale.
* Traductions en allemand, en espagnol et en portugais du Brésil."""
