description = "Macht die ChatGPT-App für Windows mit NVDA leichter bedienbar. Sie sagt Aktivitäten an, unterstützt Sprachausgabe, Braille und Klänge und bietet Chatnavigation, Sprachsteuerung und eine bessere Fokusbehandlung in ChatGPT und Codex."
changelog = """* Arbeitsklänge und Fortschrittsmeldungen folgen dem eigenen Aufgaben-Timer von ChatGPT. Ein neuer Befehl, „Den nativen Aufgaben-Timer lesen“, kann in den Tastenbefehlen zugewiesen werden.
* NVDA sagt beim Wechseln des Chats einmal dessen Titel an, und NVDA+Umschalt+C wiederholt ihn.
* Strg+1 bis Strg+0 lesen die Nachrichten der Unterhaltung, in der Sie sich befinden, in jeder Sprache der ChatGPT-Oberfläche.
* Neue Befehle, die in den Tastenbefehlen zugewiesen werden können, wechseln zum ersten Projekt oder zum ersten zuletzt verwendeten Chat in der Seitenleiste oder archivieren den fokussierten Chat in der Seitenleiste. NVDA sagt außerdem an, wenn die Seitenleiste ein- oder ausgeblendet wird.
* Übersetzungen ins Deutsche, Spanische und brasilianische Portugiesisch."""
