description = "Macht die ChatGPT-App für Windows mit NVDA leichter bedienbar. Sie sagt Aktivitäten an, unterstützt Sprachausgabe, Braille und Klänge und bietet Chatnavigation, Sprachsteuerung und eine bessere Fokusbehandlung in ChatGPT und Codex."
changelog = """* Arbeitsklänge und Fortschrittsmeldungen folgen dem eigenen Aufgaben-Timer von ChatGPT. Ein neuer Befehl, „Den nativen Aufgaben-Timer lesen“, kann in den Tastenbefehlen zugewiesen werden.
* NVDA+Umschalt+C liest den Titel des aktuellen Chats, und NVDA sagt den Titel an, wenn Sie den Chat wechseln.
* Strg+1 bis Strg+0 lesen aktuelle Nachrichten in jeder Sprache der ChatGPT-Oberfläche."""
