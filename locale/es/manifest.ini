description = "Hace que la aplicación de ChatGPT para Windows sea más fácil de usar con NVDA. Anuncia la actividad, admite voz, braille y sonidos, y añade navegación entre chats, controles de voz y una mejor gestión del foco tanto en ChatGPT como en Codex."
changelog = """* Los sonidos de trabajo y las actualizaciones de progreso siguen el temporizador de tareas propio de ChatGPT. Un nuevo comando, Leer el temporizador nativo de la tarea, se puede asignar en Gestos de entrada.
* NVDA anuncia una vez el título del chat cuando cambias de chat, y NVDA+Mayúsculas+C lo repite.
* Control+1 a Control+0 leen los mensajes de la conversación en la que estás, en cualquier idioma de la interfaz de ChatGPT.
* Nuevos comandos, asignables en Gestos de entrada, van al primer proyecto o al primer chat reciente de la barra lateral, o archivan el chat enfocado de la barra lateral. NVDA también anuncia cuándo se muestra u oculta la barra lateral.
* Traducciones al alemán, español y portugués de Brasil."""
