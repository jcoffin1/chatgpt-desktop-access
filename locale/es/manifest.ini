description = "Hace que la aplicación de ChatGPT para Windows sea más fácil de usar con NVDA. Anuncia la actividad, admite voz, braille y sonidos, y añade navegación entre chats, controles de voz y una mejor gestión del foco tanto en ChatGPT como en Codex."
changelog = """* Los sonidos de trabajo y las actualizaciones de progreso siguen el temporizador de tareas propio de ChatGPT. Un nuevo comando, Leer el temporizador nativo de la tarea, se puede asignar en Gestos de entrada.
